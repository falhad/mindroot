# Mindroot web app: static files from scripts/deploy-web.sh.
# Put this in /etc/nginx/sites-available/mindroot.app and get a certificate (for example with certbot).

server {
    listen 80;
    listen [::]:80;
    server_name mindroot.app www.mindroot.app;
    return 301 https://mindroot.app$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mindroot.app;

    ssl_certificate     /etc/letsencrypt/live/mindroot.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mindroot.app/privkey.pem;

    root /var/www/mindroot.app;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    types { application/manifest+json webmanifest; }

    # nginx drops inherited add_header lines when a location has its own, so each location repeats them.
    location /assets/ {
        include /etc/nginx/snippets/mindroot-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/mindroot-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}

# /etc/nginx/snippets/mindroot-headers.conf:
