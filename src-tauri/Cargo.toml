[package]
name = "branchmint"
version = "0.2.0"
description = "Branchmint — a fast, beautiful mind-mapping app"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[lib]
name = "branchmint_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-fs = "2.7"
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
reqwest = { version = "0.13.3", default-features = false, features = ["rustls"] }
tauri-plugin-global-shortcut = "2.3.2"
zip = { version = "4.2.0", default-features = false, features = ["deflate"] }
sha2 = "0.10.9"
tauri-plugin-updater = "2.12.0"
tauri-plugin-process = "2.3.1"

[dev-dependencies]
tauri = { version = "2.12", features = ["test"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
