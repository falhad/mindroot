name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PNPM_VERSION: 12.8.1

jobs:
  test:
    name: Type-check and tests
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install -g pnpm@${{ env.PNPM_VERSION }}

      - name: Install Linux libraries for Tauri
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libdbus-1-dev

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      # The sync tests run real git against a local bare repository.
      - name: Frontend tests
        run: pnpm test

      # The sync tests record the git calls the engine makes. If the recorded file changed,
      # the engine and the Rust allow-list may be out of step: commit the new file.
      - name: Git call contract is up to date
        run: git diff --exit-code -- src-tauri/tests/fixtures

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  build-web:
    name: Production web build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: npm install -g pnpm@${{ env.PNPM_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:web

  e2e:
    name: End-to-end tests (browser)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: npm install -g pnpm@${{ env.PNPM_VERSION }}
      - run: pnpm install --frozen-lockfile
      # The browser install uses the system package mirror, which sometimes does not answer. Try again.
      - name: Install the browser for the tests
        timeout-minutes: 15
        run: |
          for attempt in 1 2 3; do
            if timeout 240 pnpm exec playwright install --with-deps chromium; then exit 0; fi
            echo "Attempt $attempt failed. Waiting 20 seconds."
            sleep 20
          done
          exit 1
      - run: pnpm e2e
