name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PNPM_VERSION: 12.8.1

jobs:
  test:
    name: Type-check and tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install -g pnpm@${{ env.PNPM_VERSION }}

      - name: Install Linux libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      # The sync tests run real git against a local bare repository.
      - name: Frontend tests
        run: pnpm test

      # The sync tests record the git calls the engine makes. If the recorded file changed,
      # the engine and the Rust allow-list may be out of step: commit the new file.
      - name: Git call contract is up to date
        run: git diff --exit-code -- src-tauri/tests/fixtures

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  build-web:
    name: Production web build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g pnpm@${{ env.PNPM_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
