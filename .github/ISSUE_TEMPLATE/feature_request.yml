name: Feature request
description: Propose an idea or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem do you want to solve?
      description: Describe the moment when you needed this.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How could it work? Could it be a plugin (docs/plugins.md)?
  - type: checkboxes
    id: help
    attributes:
      label: Help
      options:
        - label: I can open a pull request for this
