name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What occurred?
      description: Say what you saw, and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a map
        2. Press ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Mindroot version
      description: The version in the name of the installer file, or in package.json if you build from source.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: System
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows
        - Linux
        - Browser (pnpm dev)
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, files, logs
      description: An exported map (JSON) that shows the problem helps a lot. Remove private content first.
