      <main style="max-width: 44rem; margin: 3rem auto; padding: 0 1rem; font: 16px/1.6 system-ui, sans-serif">
        <h1>Mindroot: fast, keyboard-first mind mapping</h1>
        <p>
          Mindroot is a free, open-source mind-mapping app for macOS, Windows, Linux and the browser. It is local-first: your maps are
          plain files on your disk, with no account and no cloud. It is keyboard-first: Tab adds a child idea, Enter adds a sibling,
          and you can build a full map without the mouse.
        </p>
        <p><strong>This page is the app itself, and it needs JavaScript.</strong> Turn on JavaScript to use Mindroot in the browser, or install the desktop app.</p>
        <ul>
          <li><a href="https://github.com/falhad/mindroot/releases/latest">Download for macOS, Windows and Linux</a></li>
          <li><a href="https://github.com/falhad/mindroot">Source code on GitHub (MIT license)</a></li>
          <li><a href="/llms-full.txt">Full description: features, install steps and common questions</a></li>
        </ul>
        <h2>Features</h2>
        <ul>
          <li>Six layouts: mind map, right tree, left tree, org chart down and up, radial.</li>
          <li>Notes in Markdown with code and LaTeX. Tags, tasks, due dates, files and links on each idea.</li>
          <li>Sync between computers with your own Git repository. Changes merge idea by idea.</li>
          <li>Right-to-left maps for Persian, Arabic and Hebrew.</li>
          <li>An optional AI assistant that makes a map from a topic or a pasted text, with your own API key.</li>
          <li>Import from XMind, FreeMind, OPML, Markdown and Obsidian canvas. Export to PNG, SVG, PDF, Markdown and OPML.</li>
          <li>Outline view, focus mode, presentation mode, live collaboration and plugins.</li>
        </ul>
      </main>
